<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="no-referrer" />
    <title>DefiMind owner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="brand">
      <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="lgm1" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0" stop-color="#3fd9ff" />
            <stop offset=".5" stop-color="#5b8cff" />
            <stop offset="1" stop-color="#9b6bff" />
          </linearGradient>
          <filter id="mglow1" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" />
          </filter>
        </defs>
        <g fill="none" stroke="url(#lgm1)">
          <g filter="url(#mglow1)" opacity=".95">
            <circle cx="50" cy="50" r="40" stroke-width="3.6" />
            <path
              d="M50 24 69 31 V48 c0 13-8.2 22-19 26.6 C39.2 70 31 61 31 48 V31 Z"
              stroke-width="4"
            />
            <path d="M49 47 38.5 72 M51 47 61.5 72" stroke-width="8" />
            <circle cx="50" cy="43" r="6.6" fill="#5fb3ff" stroke="none" />
          </g>
          <circle cx="50" cy="50" r="40" stroke-width="3" />
          <path
            d="M50 24 69 31 V48 c0 13-8.2 22-19 26.6 C39.2 70 31 61 31 48 V31 Z"
            stroke-width="3.4"
            stroke-linejoin="round"
          />
          <path d="M49 47 38.5 72 M51 47 61.5 72" stroke-width="7.5" />
          <circle cx="50" cy="43" r="6.6" fill="#5fb3ff" stroke="#050505" stroke-width="2.4" />
        </g>
      </svg>
      <span class="wordmark">DefiMind</span>
    </header>
    <main id="app" data-state="info"><h1>Loading…</h1></main>
    <script type="application/json" id="config">
      %CONFIG%
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
